name: Build Playnite Achievements (Recomps)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playnite-achievements-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore dependencies
        shell: pwsh
        run: |
          nuget restore source/PlayniteAchievements.sln -NonInteractive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore tests/PlayniteAchievements.Tests/PlayniteAchievements.Tests.csproj

      - name: Compile extension
        shell: pwsh
        run: msbuild source/PlayniteAchievements.csproj /p:Configuration=Release /p:Platform=AnyCPU /m:1 /v:normal /bl:spartanport-build.binlog

      - name: Run local achievement and regression tests
        shell: pwsh
        run: dotnet test tests/PlayniteAchievements.Tests/PlayniteAchievements.Tests.csproj --configuration Release --no-restore --filter "TestCategory!=LocalInstallation" --logger "trx;LogFileName=spartanport-tests.trx" -bl:spartanport-tests.binlog

      - name: Prepare native Xbox 360 metadata extractor
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $download = Join-Path $env:RUNNER_TEMP "rexglue-sdk-0.10.0-win-amd64.zip"
          $unpacked = Join-Path $env:RUNNER_TEMP "rexglue-sdk"
          Invoke-WebRequest -Uri "https://github.com/rexglue/rexglue-sdk/releases/download/v0.10.0/rexglue-sdk-0.10.0-win-amd64.zip" -OutFile $download
          $actual = (Get-FileHash -LiteralPath $download -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne "ad4485da853fbe932e9f5dbb643f9b5fe85dc73775ebbad4df6879fe6df0c11b") {
            throw "XDBF SDK archive SHA256 mismatch."
          }
          Expand-Archive -LiteralPath $download -DestinationPath $unpacked -Force
          $cli = Get-ChildItem -LiteralPath $unpacked -Filter rexglue.exe -File -Recurse | Select-Object -First 1
          if (-not $cli) { throw "SDK archive does not contain rexglue.exe." }
          $target = Join-Path $PWD "source/bin/Release/Tools/ReXGlue"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Get-ChildItem -LiteralPath $cli.Directory.FullName -File |
            Where-Object { $_.Name -eq "rexglue.exe" -or $_.Extension -eq ".dll" } |
            ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination $target -Force }
          Copy-Item -LiteralPath "source/Providers/ReXGlue/REXGLUE_LICENSE.txt" -Destination (Join-Path $target "LICENSE-rexglue-sdk.txt") -Force
          if (-not (Test-Path (Join-Path $target "rexglue.exe"))) {
            throw "XDBF extractor was not packaged."
          }
          & (Join-Path $target "rexglue.exe") init achievements --help
          if ($LASTEXITCODE -ne 0) { throw "Packaged rexglue CLI could not start." }

      - name: Package extension
        shell: pwsh
        run: |
          $build = Join-Path $PWD "source/bin/Release"
          if (-not (Test-Path (Join-Path $build "PlayniteAchievements.dll"))) {
            throw "Release assembly not found."
          }
          $stage = Join-Path $env:RUNNER_TEMP "playnite-spartanport"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item (Join-Path $build "*") $stage -Recurse -Force
          Copy-Item source/extension.yaml $stage -Force
          Copy-Item source/icon.png $stage -Force
          $zip = Join-Path $env:RUNNER_TEMP "PlayniteAchievements_Recomps_BETA06.zip"
          foreach ($required in @('PlayniteAchievements.dll', 'PlayniteAchievementsHelper.exe', 'extension.yaml', 'icon.png', 'Localization/pt_BR.xaml', 'Tools/ReXGlue/rexglue.exe', 'Tools/ReXGlue/LICENSE-rexglue-sdk.txt', 'Resources/Reblue/LICENSE.txt', 'Resources/Reblue/0x10006.png')) {
            if (-not (Test-Path (Join-Path $stage $required))) { throw "Package entry missing: $required" }
          }
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $zip -CompressionLevel Optimal
          Rename-Item -Path $zip -NewName "PlayniteAchievements_Recomps_BETA06.pext"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SpartanPort-Build-Diagnostics
          path: |
            spartanport-tests.binlog
            spartanport-build.binlog
            tests/PlayniteAchievements.Tests/TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 30

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PlayniteAchievements-Recomps-BETA06-Windows
          path: ${{ runner.temp }}/PlayniteAchievements_Recomps_BETA06.pext
          if-no-files-found: error
          retention-days: 30
